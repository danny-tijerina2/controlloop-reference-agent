prohibited_capabilities:
  - agent: widgetworks-order-support-agent
    edge_type: writes
    target: customer-payment-methods
data_classification:
  - resource: orders-table
    sensitivity: confidential
ceilings:
  - agent: widgetworks-order-support-agent
    # AMENDED: customer-payment-methods removed from prohibited_resources,
    # so the capability this pull request adds is now within the ceiling.
    prohibited_delegation_targets:
      - unapproved-agent
