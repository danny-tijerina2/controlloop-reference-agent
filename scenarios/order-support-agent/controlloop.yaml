schema_version: "1.1.0"
owner: support-eng
trust_boundaries:
  - name: order-support-boundary
    agents:
      - widgetworks-order-support-agent
approvals:
  - capability: order-support-tools-mcp
    approver: support-eng-lead
    expires_at: "2027-08-23T00:00:00Z"
prohibited_capabilities:
  - agent: widgetworks-order-support-agent
    edge_type: writes
    target: customer-payment-methods
data_classification:
  - resource: orders-table
    sensitivity: confidential
ceilings:
  - agent: widgetworks-order-support-agent
    prohibited_resources:
      - customer-payment-methods
    prohibited_delegation_targets:
      - unapproved-agent
  - prohibited_data_classes: [restricted]
    prohibited_external_destinations: [pastebin.com]
# Every tool declared privileged in tool_capabilities below needs an
# audit path, or policy.missing-action-logging blocks the gate.
logged_tools:
  - tool: Issue a refund
    audit_path: logs/refund-audit.log
  - tool: Look up an order
    audit_path: logs/order-lookup-audit.log
  - tool: Reply to customer
    audit_path: logs/customer-reply-audit.log

# What these tools actually do. Discovery can read an agent card and an
# OpenAPI spec, but nothing in a repository states that issuing a refund
# moves money -- so without this block ControlLoop cannot classify any of
# this agent's capabilities, and every scan reports "no material
# capability is reachable". See controlloop#249.
#
# Names match what discovery found: an a2a skill's node name is its
# card `name`, not its `id`.
tool_capabilities:
  - tool: Issue a refund
    financial_action: true
    read_only: false
    sensitivity: confidential
  - tool: Look up an order
    read_only: true
    sensitivity: confidential
  - tool: Reply to customer
    external_communication: true
    read_only: false

# Every pattern-rule finding this scenario produces is explicitly
# suppressed, so the only thing left that can block the gate is the
# declared capability ceiling itself. That is the whole point of the
# scenario: if the ceiling is decoration, this pull request passes.
suppressions:
  - rule_id: policy.undeclared-tools
    target: clp:finding:sha256:829b7e68b1b88cb7c03bc1ffed58b47ad706094d4314a8769b09073cc5ca76b1
    reason: "scenario: pattern rules deliberately disabled to isolate the ceiling"
    expires_at: "2027-08-24"
  - rule_id: policy.undeclared-tools
    target: clp:finding:sha256:b410ad2e23bd479a8bdc81bfe228c6e527e7fe70590c1b52745a12236d3ef290
    reason: "scenario: pattern rules deliberately disabled to isolate the ceiling"
    expires_at: "2027-08-24"
  - rule_id: policy.undeclared-tools
    target: clp:finding:sha256:c5914bf37db3413b6a9dc0244b46dd0041cd73b6577989cb2d768a99930bdbf9
    reason: "scenario: pattern rules deliberately disabled to isolate the ceiling"
    expires_at: "2027-08-24"
  - rule_id: policy.undeclared-tools
